name: Build APK from uploaded zip

# HOW TO USE (all in the GitHub website, nothing to install):
#   1. Make a new repository, then Add file > Create new file.
#      Name it exactly:  .github/workflows/upload.yml   and paste this whole file. Commit.
#   2. Add file > Upload files > drop iqraa.zip (do NOT unzip it) > Commit to main.
#   3. Open the Actions tab. When "Build APK from uploaded zip" is green, open the run
#      and download the artifact at the bottom (iqraa-apk-FULL-QURAN). Unzip it, install app-release.apk.
#   If you added the zip before this file, use Actions > this workflow > Run workflow.
#
# No Expo account, no keys, no secrets. The build downloads the full Quran
# (Arabic + English + Hausa, validated: 114 surahs / 6236 ayahs) and bakes it into the APK.
# If that download fails, the build still finishes but the artifact is named
# iqraa-apk-MVP-ONLY (only Al-Fatiha and Al-Ikhlas) and the run summary says why.

on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:

concurrency:
  group: upload-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the newest zip in the repo root
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "::error::No .zip file found in the repository root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          PKG=$(find project -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$PKG" ]; then echo "::error::package.json not found inside $ZIP"; exit 1; fi
          echo "APP_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Align Expo package versions with the SDK
        working-directory: ${{ env.APP_DIR }}
        run: npx expo install --fix

      - name: Download and validate the full Quran
        id: data
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: npm run build:data

      - name: Unit tests
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Bundle the JavaScript (catches code errors early)
        working-directory: ${{ env.APP_DIR }}
        run: npx expo export --platform android

      - name: Generate the Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle more memory and accept Android licences
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.data.outcome }}" = "success" ]; then
            echo "### Full Quran included (114 surahs, 6236 ayahs, Arabic + English + Hausa)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### WARNING: Quran download/validation failed. This APK only has Al-Fatiha and Al-Ikhlas." >> "$GITHUB_STEP_SUMMARY"
            echo "Open the step 'Download and validate the full Quran' to see the reason." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iqraa-apk-${{ steps.data.outcome == 'success' && 'FULL-QURAN' || 'MVP-ONLY' }}
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
